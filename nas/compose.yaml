name: alger-music-nas
services:
  alger-music:
    container_name: alger-music
    build:
      context: ..
      dockerfile: nas/Dockerfile
    image: alger-music-nas:0.3.7
    ports:
      - "${NAS_BIND_IP:-0.0.0.0}:${ALGER_PORT:-18080}:8080"
    environment:
      NAS_PUBLIC_ORIGINS: ${NAS_PUBLIC_ORIGINS:-}
      NAS_REQUIRE_AUTH: ${NAS_REQUIRE_AUTH:-0}
      NAS_ACCESS_KEY: ${NAS_ACCESS_KEY:-}
      DATA_DIR: /data
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - alger-music-data:/data
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  alger-music-data:
